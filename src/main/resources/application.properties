spring.application.name=adb-taller-git-2026

# H2 en archivo: conserva los registros después de reiniciar la aplicación.
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cliente de la API externa; los tiempos se expresan como Duration de Spring.
restful-api.base-url=https://api.restful-api.dev
restful-api.connect-timeout=3s
restful-api.request-timeout=10s

# Proyecto Minecraft remoto: GET para consultar y PUT para aplicar daño explícitamente.
minecraft-api.base-url=${MINECRAFT_API_BASE_URL:http://10.40.142.72:8081}
minecraft-api.connect-timeout=3s
minecraft-api.request-timeout=10s

# Documentación de todos los controladores REST, incluidas las rutas de compatibilidad.
springdoc.packages-to-scan=py.edu.uc.lp3.rest.controller
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Las respuestas de error se declaran por operación, no para todos los endpoints.
springdoc.override-with-generic-response=false

# POO-09: contratos independientes; los IDs pertenecen a cada proveedor.
poo09.sofia.base-url=${SOFIA_API_BASE_URL:http://100.79.75.27:8081}
poo09.nicolas.base-url=${NICOLAS_API_BASE_URL:http://100.83.179.97:8080}
poo09.connect-timeout=3s
poo09.request-timeout=10s
